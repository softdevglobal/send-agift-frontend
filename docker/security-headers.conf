# Browser security policy for the web app's own responses. Included in every
# location that adds headers, because a location's own add_header replaces
# the server's. API responses get theirs from the Go server.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Location stays on for the delivery pin; nothing else is asked for.
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
# Report-only first: it logs what it would block in the browser console
# without breaking a page. Enforce it once a release shows no reports.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://accounts.google.com https://connect.facebook.net https://appleid.cdn-apple.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src https://accounts.google.com https://www.facebook.com https://appleid.apple.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https:; object-src 'none'" always;
# HSTS is left to the TLS edge, once the domains it should cover are agreed.
